services:
  - type: web
    name: telegram-bot-html-admin
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_FILE
        value: bot_database.json
      - key: LOG_FILE
        value: bot_activity.log
