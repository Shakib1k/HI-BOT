<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="robots" content="noindex,nofollow">
<title>Bot Admin Panel</title>
<style>
:root{
  --bg:#07070b; --bg2:#0d0d14; --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.09); --text:#f3f3f7; --muted:#9a9aab; --red:#ff2d4a; --red2:#ff5a6e;
  --redglow:rgba(255,45,74,.35); --green:#2ee59d; --amber:#ffb020; --radius:18px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Bengali","Noto Sans",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45}
body{min-height:100vh;background:
  radial-gradient(900px 500px at 85% -10%,rgba(255,45,74,.16),transparent 60%),
  radial-gradient(700px 500px at -10% 110%,rgba(120,40,255,.10),transparent 60%),var(--bg);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,textarea,select{font:inherit;color:inherit}
.hidden{display:none!important}
a{color:var(--red2)}

/* glass */
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 40px rgba(0,0,0,.35)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);
  background:var(--glass2);padding:11px 16px;border-radius:14px;cursor:pointer;font-weight:600;
  transition:.18s;user-select:none;min-height:44px}
.btn:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--red),#c4102f);border-color:transparent;box-shadow:0 8px 26px var(--redglow)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--red2);border-color:rgba(255,45,74,.35)}
.btn.small{padding:7px 12px;min-height:36px;font-size:13px;border-radius:11px}
.btn[disabled]{opacity:.5;pointer-events:none}

/* inputs */
label.f{display:block;margin:0 0 14px}
label.f>span{display:block;font-size:12px;color:var(--muted);margin:0 0 6px;letter-spacing:.04em;text-transform:uppercase}
input[type=text],input[type=password],input[type=number],textarea,select{width:100%;background:rgba(0,0,0,.35);
  border:1px solid var(--line);border-radius:13px;padding:12px 14px;outline:none;transition:.15s}
select option{background:#14141c}
textarea{min-height:120px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--redglow)}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login .card{width:100%;max-width:400px;padding:34px 26px;text-align:center}
.logo{width:74px;height:74px;margin:0 auto 18px;border-radius:22px;display:grid;place-items:center;font-size:36px;
  background:linear-gradient(135deg,var(--red),#7b0b1e);box-shadow:0 14px 40px var(--redglow)}
h1{font-size:24px;margin:0 0 4px;letter-spacing:.01em}
.sub{color:var(--muted);margin:0 0 22px}
.err{color:var(--red2);min-height:20px;margin:10px 0 0;font-size:13px}

/* shell */
#app{max-width:1100px;margin:0 auto;padding:14px 14px 90px}
.top{display:flex;align-items:center;gap:12px;padding:12px 14px;position:sticky;top:max(8px,env(safe-area-inset-top));z-index:20;margin-bottom:16px}
.top .logo{width:42px;height:42px;font-size:20px;margin:0;border-radius:13px;flex:none}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;font-size:16px}
.top .ttl small{color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);display:inline-block}
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px;color:var(--muted)}
.crumbs .btn{min-height:38px}

/* tiles (inline-keyboard style) */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;text-align:left;padding:18px 16px;border-radius:var(--radius);cursor:pointer;border:1px solid var(--line);
  background:var(--glass);transition:.2s;display:flex;flex-direction:column;gap:6px;min-height:104px}
.tile:hover{border-color:rgba(255,45,74,.5);transform:translateY(-3px);box-shadow:0 14px 34px rgba(0,0,0,.4),0 0 0 1px rgba(255,45,74,.25)}
.tile:active{transform:scale(.98)}
.tile .ic{font-size:26px}
.tile b{font-size:15px}
.tile small{color:var(--muted);font-size:12px}
.tile .badge{position:absolute;top:12px;right:12px;background:var(--red);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:2px 8px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{padding:14px 16px}
.stat b{font-size:26px;display:block;background:linear-gradient(135deg,#fff,var(--red2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}

/* toggles */
.toggles{display:grid;gap:10px;margin-bottom:18px}
@media(min-width:700px){.toggles{grid-template-columns:repeat(3,1fr)}}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;cursor:pointer}
.tg b{display:block}.tg small{color:var(--muted)}
.sw{width:50px;height:28px;border-radius:999px;background:rgba(255,255,255,.12);position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--red);box-shadow:0 0 16px var(--redglow)}.sw.on::after{left:25px}

/* sub nav (nested buttons) */
.subnav{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav .btn{white-space:nowrap}
.subnav .btn.active{background:linear-gradient(135deg,var(--red),#c4102f);border-color:transparent;box-shadow:0 6px 20px var(--redglow)}
.cc-tabs{display:flex;flex-wrap:wrap;gap:6px}
.cc-tabs .btn.active{background:linear-gradient(135deg,var(--red),#c4102f);border-color:transparent;box-shadow:0 6px 20px var(--redglow)}

.panel{padding:18px}
.panel h3{margin:0 0 14px;font-size:17px}
.grid2{display:grid;gap:12px}@media(min-width:700px){.grid2{grid-template-columns:1fr 1fr}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:36px 10px}

/* list items */
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:15px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.item .ic{font-size:24px;flex:none}
.item .mid{flex:1;min-width:0}
.item .mid b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mid small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .acts{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.09);color:var(--muted)}
.tag.red{background:rgba(255,45,74,.18);color:var(--red2)}.tag.green{background:rgba(46,229,157,.15);color:var(--green)}

/* dropzone */
.drop{border:2px dashed rgba(255,45,74,.45);border-radius:var(--radius);padding:34px 16px;text-align:center;cursor:pointer;transition:.2s;background:rgba(255,45,74,.04)}
.drop.over,.drop:hover{background:rgba(255,45,74,.12);border-color:var(--red)}
.drop .big{font-size:40px}
.pbar{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--red2));transition:width .15s}
.up{padding:10px 12px;border:1px solid var(--line);border-radius:13px;margin-top:8px;font-size:13px}

/* logs */
pre.log{background:#050508;border:1px solid var(--line);border-radius:14px;padding:12px;max-height:60vh;overflow:auto;font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word;color:#c9c9d6}

/* toast + modal */
#toasts{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:100;display:grid;gap:8px;width:min(92vw,420px)}
.toast{padding:13px 16px;border-radius:14px;background:#17171f;border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.6);animation:in .25s}
.toast.ok{border-color:rgba(46,229,157,.5)}.toast.bad{border-color:rgba(255,45,74,.6)}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:90;padding:20px}
#modal .box{max-width:380px;width:100%;padding:22px}
.spin{width:20px;height:20px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--red);border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.center{text-align:center;padding:40px}
.glide-in{animation:glideIn .32s cubic-bezier(.22,1,.36,1)}
@keyframes glideIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
.item{transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.item:active{transform:scale(.98)}
.btn,.tg,.card{transition:transform .15s ease,box-shadow .2s ease,border-color .2s ease}
.btn:active{transform:scale(.96)}
.swipe-wrap{position:relative;overflow:hidden;border-radius:16px}
.swipe-del{position:absolute;inset:0 0 0 auto;width:84px;background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;border-radius:0 16px 16px 0}
.swipe-content{position:relative;transition:transform .18s ease;background:inherit}
.chk{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.chkrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);cursor:pointer}
.chkrow input{width:20px;height:20px;flex:none;accent-color:#8b5cf6}
input[type=datetime-local]{width:100%}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="hidden">
  <form class="card glass" id="loginForm" autocomplete="on">
    <div class="logo">🦊</div>
    <h1>Admin Panel</h1>
    <p class="sub">Sign in to control your bot</p>
    <label class="f"><span>Password</span>
      <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••" required></label>
    <button class="btn primary" style="width:100%" id="loginBtn" type="submit">Sign in</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="top glass">
    <div class="logo">🦊</div>
    <div class="ttl"><b>Bot Admin Panel</b><small><i class="dot"></i><span id="botName">connecting…</span></small></div>
    <button class="btn small" id="refreshBtn" title="Refresh">⟳</button>
    <button class="btn small danger" id="logoutBtn">Logout</button>
  </div>
  <div id="view"></div>
</div>

<div id="toasts"></div>
<div id="modal" class="hidden"><div class="box glass" id="modalBox"></div></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TK = "adm_token";
let token = localStorage.getItem(TK) || "";
let stats = null;

function toast(msg, ok = true) {
  const t = document.createElement("div");
  t.className = "toast " + (ok ? "ok" : "bad");
  t.textContent = msg;
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), 3600);
}

function confirmBox(title, body, okLabel = "Confirm") {
  return new Promise(res => {
    $("#modalBox").innerHTML = `<h3 style="margin:0 0 8px">${esc(title)}</h3><p class="muted" style="margin:0 0 18px">${esc(body)}</p>
      <div class="row" style="justify-content:flex-end"><button class="btn" id="mNo">Cancel</button><button class="btn primary" id="mYes">${esc(okLabel)}</button></div>`;
    $("#modal").classList.remove("hidden");
    const done = v => { $("#modal").classList.add("hidden"); res(v); };
    $("#mNo").onclick = () => done(false);
    $("#mYes").onclick = () => done(true);
  });
}

async function api(path, opts = {}) {
  const o = { method: opts.method || "GET", headers: { "Authorization": "Bearer " + token } };
  if (opts.json !== undefined) { o.headers["Content-Type"] = "application/json"; o.body = JSON.stringify(opts.json); }
  if (opts.form) o.body = opts.form;
  let r, d;
  try { r = await fetch("/api/admin" + path, o); d = await r.json(); }
  catch (e) { throw new Error("Network error"); }
  if (r.status === 401) { logout(true); throw new Error("Session expired"); }
  if (!d.ok) throw new Error(d.error || "Request failed");
  return d;
}
const act = async (fn, okMsg) => { try { const r = await fn(); if (okMsg) toast(okMsg); return r; } catch (e) { toast(e.message, false); return null; } };

function copy(text) {
  const done = () => toast("Copied");
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fb());
  else fb();
  function fb() { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); done(); } catch { toast("Copy failed", false); } t.remove(); }
}
const fmtDate = s => { if (!s) return "—"; const d = new Date(s); return isNaN(d) ? s : d.toLocaleString(); };
const fileIcon = t => ({ photo: "🖼️", video: "🎬", audio: "🎵", document: "📄", animation: "🎞️", voice: "🎙️" }[t] || "📄");

/* ---------- auth ---------- */
function showLogin() { $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); $("#pw").focus(); }
function showApp() { $("#login").classList.add("hidden"); $("#app").classList.remove("hidden"); route(); }
function logout(silent) {
  if (!silent) fetch("/api/admin/logout", { method: "POST", headers: { Authorization: "Bearer " + token } }).catch(() => {});
  token = ""; localStorage.removeItem(TK); showLogin();
}
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const b = $("#loginBtn"); b.disabled = true; $("#loginErr").textContent = "";
  try {
    const r = await fetch("/api/admin/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: $("#pw").value }) });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || "Login failed");
    token = d.token; localStorage.setItem(TK, token); $("#pw").value = ""; showApp();
  } catch (er) { $("#loginErr").textContent = er.message; }
  b.disabled = false;
});
$("#logoutBtn").onclick = () => logout();
$("#refreshBtn").onclick = () => route();

/* ---------- router (hash: #module/sub) ---------- */
const MODS = {
  files:    { ic: "📁", name: "File Manager", desc: "Upload, links, keys", subs: [["upload","⬆️ Upload"],["key","🔑 Create Key"],["list","📋 All Items"]] },
  projects: { ic: "🗂️", name: "Projects", desc: "Project files", subs: [["add","➕ Add"],["list","📋 View"]] },
  users:    { ic: "👥", name: "Users", desc: "List, ban, message", subs: [["list","📋 All Users"],["ban","⛔ Ban / Unban"],["msg","✉️ Message"]] },
  broadcast:{ ic: "📢", name: "Broadcast", desc: "Message everyone", subs: [] },
  autoreply:{ ic: "💬", name: "Auto Reply", desc: "Keywords & commands", subs: [["kw","📝 Keywords"],["cmd","⌨️ Commands"]] },
  join:     { ic: "🔒", name: "Join", desc: "Force-join channels", subs: [["view","👀 View Join"],["add","➕ Add New Channel"],["del","🗑️ Delete Channel"],["list","📋 View Channels"],["groups","📁 Channel Groups"]] },
  editors:  { ic: "✏️", name: "Text Editors", desc: "Welcome & join text", subs: [["welcome","👋 Welcome"],["join","🔒 Join Text"]] },
  giveaway: { ic: "🎁", name: "Giveaway", desc: "Start / end / winners", subs: [] },
  admins:   { ic: "👑", name: "Admins", desc: "Sub-admins", subs: [] },
  channeladmins: { ic: "👑", name: "Channel Admin Manager", desc: "Search channels, add & manage admins", subs: [] },
  savedchannels: { ic: "📡", name: "Telegram Saved Channels", desc: "Save IDs, verify & reuse channel names", subs: [["list","📋 Saved Channels"],["add","➕ Add Channel"]] },
  connect:  { ic: "🔗", name: "Connect Channel", desc: "Auto-copy posts", subs: [] },
  schedule: { ic: "⏰", name: "Scheduler", desc: "Posts & deletions", subs: [["new","➕ New Post"],["posts","📤 Pending"],["newdel","🗑️ Schedule Delete"],["dels","📋 Deletions"]] },
  reaction: { ic: "🎭", name: "Reaction Bots", desc: "Add / view / remove", subs: [["add","➕ Add Bots"],["list","📋 View"]] },
  userbot:  { ic: "🤖", name: "AI Userbot", desc: "Add account, reset", subs: [["add","➕ Add Account"],["list","📋 Accounts"]] },
  logs:     { ic: "🧾", name: "Logs", desc: "Latest activity", subs: [] },
  danger:   { ic: "⚠️", name: "Danger Zone", desc: "Clear all data", subs: [] },
};
let cur = { mod: "", sub: "" };
window.addEventListener("hashchange", () => token && route());

function go(mod, sub) { location.hash = mod ? "#" + mod + (sub ? "/" + sub : "") : "#"; }

async function route() {
  if (!token) return showLogin();
  const [mod = "", sub = ""] = location.hash.replace(/^#/, "").split("/");
  cur = { mod: MODS[mod] ? mod : "", sub };
  const v = $("#view");
  v.classList.remove("glide-in"); void v.offsetWidth; v.classList.add("glide-in");
  v.innerHTML = `<div class="center"><span class="spin"></span></div>`;
  try {
    stats = await api("/stats");
    $("#botName").textContent = stats.bot_username ? "@" + stats.bot_username : "online";
    if (!cur.mod) return renderHome(v);
    const m = MODS[cur.mod];
    if (!cur.sub && m.subs.length) cur.sub = m.subs[0][0];
    v.innerHTML = `<div class="crumbs"><button class="btn small" onclick="go('')">🔙 Home</button><span>›</span><b style="color:var(--text)">${m.ic} ${m.name}</b></div>`
      + (m.subs.length ? `<div class="subnav">${m.subs.map(s => `<button class="btn ${s[0] === cur.sub ? "active" : ""}" onclick="go('${cur.mod}','${s[0]}')">${s[1]}</button>`).join("")}</div>` : "")
      + `<div id="body"></div>`;
    await VIEWS[cur.mod]($("#body"), cur.sub);
  } catch (e) { if (token) v.innerHTML = `<div class="empty glass panel">⚠️ ${esc(e.message)}<br><br><button class="btn" onclick="route()">Retry</button></div>`; }
}

/* ---------- home ---------- */
function toggleCard(key, title, desc, on) {
  return `<div class="tg glass" data-toggle="${key}"><div><b>${title}</b><small>${desc}</small></div><div class="sw ${on ? "on" : ""}"></div></div>`;
}
function renderHome(v) {
  const s = stats, t = s.toggles;
  const badge = n => n ? `<span class="badge">${n}</span>` : "";
  const counts = { files: s.files + s.keys, projects: s.projects, users: s.users, autoreply: s.auto_replies, join: s.channels, schedule: s.pending_posts + s.pending_deletions, reaction: s.reaction_bots };
  v.innerHTML = `
    <div class="stats">
      <div class="stat glass"><b>${s.users}</b><span>Users</span></div>
      <div class="stat glass"><b>${s.files}</b><span>Files</span></div>
      <div class="stat glass"><b>${s.keys}</b><span>Keys</span></div>
      <div class="stat glass"><b>${s.banned}</b><span>Banned</span></div>
    </div>
    <div class="toggles">
      ${toggleCard("force_join", "🔒 Force Join", "Require channel join", t.force_join)}
      ${toggleCard("maintenance_mode", "🛠️ Maintenance", "Pause the bot for users", t.maintenance_mode)}
      ${toggleCard("user_limit_enabled", "👥 User Limit", "Limit per-user usage", t.user_limit_enabled)}
      ${toggleCard("quote_captions", "💬 Quote Captions", "Posts: caption shown as quote", t.quote_captions)}
    </div>
    <div class="tiles">
      ${Object.entries(MODS).map(([k, m]) => `<button class="tile" onclick="go('${k}')">${badge(counts[k])}<span class="ic">${m.ic}</span><b>${m.name}</b><small>${m.desc}</small></button>`).join("")}
    </div>
    <div id="analytics"><div class="center" style="padding:20px"><span class="spin"></span></div></div>`;
  loadAnalytics();
}
async function loadAnalytics() {
  const box = $("#analytics");
  if (!box) return;
  try {
    const a = await api("/analytics");
    const days = Object.entries(a.signups_by_day || {});
    const maxS = Math.max(1, ...days.map(([, v]) => v));
    box.innerHTML = `

async function viewFile(id) {
  try {
    const r = await fetch("/api/admin/files/" + encodeURIComponent(id) + "/view", { headers: { Authorization: "Bearer " + token } });
    if (r.status === 401) return logout(true);
    if (!r.ok) { let d = {}; try { d = await r.json(); } catch {} throw new Error(d.error || "Cannot open file"); }
    const blob = await r.blob(), u = URL.createObjectURL(blob), t = blob.type;
    const body = /^image/.test(t) ? `<img src="${u}" style="max-width:100%;border-radius:12px">` : /^video/.test(t) ? `<video src="${u}" controls style="max-width:100%;border-radius:12px"></video>` : /^audio/.test(t) ? `<audio src="${u}" controls style="width:100%"></audio>` : `<div class="muted" style="margin:20px 0">No preview for this file type.</div>`;
    const ov = document.createElement("div");
    ov.style.cssText = "position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:18px";
    ov.innerHTML = `<div class="glass panel" style="max-width:520px;width:100%;max-height:90vh;overflow:auto;text-align:center">${body}<div class="row" style="justify-content:center;margin-top:14px"><a class="btn" href="${u}" download="${esc(id)}">⬇️ Download</a><button class="btn danger" id="vc">Close</button></div></div>`;
    document.body.appendChild(ov);
    ov.querySelector("#vc").onclick = () => { ov.remove(); URL.revokeObjectURL(u); };
  } catch (e) { toast(e.message, false); }
}
document.addEventListener("click", e => { const v = e.target.closest("[data-view]"); if (v) viewFile(v.dataset.view); });

/* shared multi-upload with progress */
function startUploads(files, url, host, extra = {}) {
  if (!files.length) return;
  files.forEach(file => {
    const row = document.createElement("div");
    row.className = "up glass";
    row.innerHTML = `<div class="row" style="justify-content:space-between"><b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%">${esc(file.name)}</b><span class="muted st">0%</span></div><div class="pbar"><i></i></div>`;
    host.prepend(row);
    const fd = new FormData(); fd.append(extra.field || "file", file);
    Object.entries(extra.fields || {}).forEach(([k, v]) => fd.append(k, v));
    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/admin" + url);
    xhr.setRequestHeader("Authorization", "Bearer " + token);
    xhr.upload.onprogress = e => { if (e.lengthComputable) { const p = Math.round(e.loaded / e.total * 100); row.querySelector("i").style.width = p + "%"; row.querySelector(".st").textContent = p < 100 ? p + "%" : "sending to Telegram…"; } };
    xhr.onload = () => {
      let d = {}; try { d = JSON.parse(xhr.responseText); } catch {}
      const st = row.querySelector(".st");
      if (xhr.status === 401) return logout(true);
      const failed = d.failed && d.failed.length ? d.failed[0].error : null;
      if (d.ok && !failed) { st.innerHTML = `<span class="tag green">done</span>`; row.querySelector("i").style.width = "100%";
        const up = d.uploaded && d.uploaded[0]; if (up && up.link) { st.innerHTML += ` <button class="btn small" data-copy="${esc(up.link)}">🔗 Copy</button> <button class="btn small" data-view="${esc(up.id)}">👁 View</button>`; row.insertAdjacentHTML("beforeend", `<div class="muted" style="font-size:12px;margin-top:8px;word-break:break-all">${esc(up.link)}</div>`); }
        if (extra.onDone) extra.onDone(d); }
      else { st.innerHTML = `<span class="tag red">${esc(failed || d.error || "failed")}</span>`; }
    };
    xhr.onerror = () => { row.querySelector(".st").innerHTML = `<span class="tag red">network error</span>`; };
    xhr.send(fd);
  });
}

    $("#bs").disabled = true;
    const r = await act(() => api("/broadcast", { method: "POST", form: fd }));
    if (!r) { $("#bs").disabled = false; return; }
    const poll = async () => {
      const j = await api("/broadcast/" + r.job_id).catch(() => null); if (!j) return;
      const p = j.total ? Math.round((j.sent + j.failed) / j.total * 100) : 100;
      $("#bp").innerHTML = `<div class="row" style="justify-content:space-between"><b>${j.done ? "✅ Finished" : "Sending…"}</b><span class="muted">${j.sent} sent · ${j.failed} failed / ${j.total}</span></div><div class="pbar"><i style="width:${p}%"></i></div>`;
      if (!j.done) setTimeout(poll, 1000); else $("#bs").disabled = false;
    };
    poll();
  };
};

/* helpers for channel targets */
const toIso = v => v ? new Date(v).toISOString() : "";
const pad = n => String(n).padStart(2, "0");
const localInput = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
async function channelPicker(host, multi) {
  const [d, groups] = await Promise.all([api("/channels"), multi ? api("/channel-groups") : Promise.resolve({ items: [] })]);
  const list = d.items.filter(c => c.chat_id);
  host.innerHTML = (multi && groups.items.length ? `<label class="f"><span>📁 Load a saved group</span><select id="chgrp"><option value="">— pick a group —</option>${groups.items.map(g => `<option value="${esc(g.id)}">${esc(g.name)} (${g.channel_ids.length})</option>`).join("")}</select></label>` : "")
    + `<div class="chk">${list.map((c, i) => `<label class="chkrow"><input type="${multi ? "checkbox" : "radio"}" name="chsel" value="${esc(c.chat_id)}" data-title="${esc(c.name)}"><span>${esc(c.name)} <small class="muted">${esc(c.chat_id)}</small></span></label>`).join("") || `<div class="muted" style="font-size:13px">No saved channels with a chat ID. Add one under Join, or type an ID below.</div>`}</div>
    <label class="f"><span>Or type chat ID / @username${multi ? " (comma separated)" : ""}</span><input type="text" id="chman" placeholder="@mychannel or -100123…"></label>`;
  if (multi && groups.items.length) {
    $("#chgrp", host).onchange = e => {
      const g = groups.items.find(x => x.id === e.target.value);
      if (!g) return;
      $$("input[name=chsel]", host).forEach(i => i.checked = g.channel_ids.includes(i.value));
    };
  }
  return () => {
    const out = [...host.querySelectorAll("input[name=chsel]:checked")].map(i => ({ id: i.value, title: i.dataset.title }));
    ($("#chman", host).value || "").split(",").map(s => s.trim()).filter(Boolean).forEach(s => out.push({ id: s, title: s }));
    return out;
  };
}
function timePicker(host) {
  const def = new Date(Date.now() + 10 * 60000);
  host.innerHTML = `<label class="f"><span>When to send</span><input type="datetime-local" id="tw" value="${localInput(def)}"></label>
    <div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:10px">${[["Now", 0], ["+10 min", 10], ["+1 hour", 60], ["+6 hours", 360], ["+1 day", 1440]].map(([l, m]) => `<button type="button" class="btn small" data-add="${m}">${l}</button>`).join("")}</div>`;
  host.querySelectorAll("[data-add]").forEach(bn => bn.onclick = () => { $("#tw", host).value = localInput(new Date(Date.now() + (+bn.dataset.add) * 60000)); });
  return () => toIso($("#tw", host).value);
}

/* SCHEDULER */
VIEWS.schedule = async (b, sub) => {
  if (sub === "new") {
    const sel = [];
    b.innerHTML = `<div class="panel glass"><h3>New scheduled post</h3>
      <div class="drop" id="drop"><div class="big">📂</div><b>Tap to choose photos, videos or files</b><div class="muted">from your phone storage · multiple allowed · up to 50 MB each</div></div>
      <input type="file" id="fi" multiple class="hidden">
      <div id="items"></div>
      <label class="f" id="txtw"><span>Text (used when no file is chosen)</span><textarea id="ptxt" placeholder="HTML allowed: &lt;b&gt;bold&lt;/b&gt;"></textarea></label>
      <h3 style="margin-top:18px">Channels</h3><div id="chs"></div>
      <h3 style="margin-top:18px">Time</h3><div id="tm"></div>
      <button class="btn primary" id="go">📤 Schedule post</button><div id="prog" style="margin-top:12px"></div></div>`;
    const getCh = await channelPicker($("#chs"), true), getT = timePicker($("#tm"));
    const modeNext = { plain: "quote", quote: "expandable", expandable: "plain" };
    const modeLabel = { plain: "📄 Plain", quote: "💬 Quote", expandable: "📂 Expandable quote" };
    const composeCaption = blocks => blocks.map(bl => {
      const t = (bl.text || "").trim();
      if (!t) return "";
      if (bl.mode === "quote") return `<blockquote>${t}</blockquote>`;
      if (bl.mode === "expandable") return `<blockquote expandable>${t}</blockquote>`;
      return t;
    }).filter(Boolean).join("\n\n");
    const draw = () => {
      $("#items").innerHTML = sel.map((s, i) => `<div class="item" style="display:block"><div class="row" style="justify-content:space-between"><b>${fileIcon(/^image/.test(s.file.type) ? "photo" : /^video/.test(s.file.type) ? "video" : "document")} ${esc(s.file.name)}</b><button class="btn small danger" data-rm="${i}">✕</button></div>
        <div data-blocks="${i}">${s.blocks.map((bl, j) => `<div style="margin-bottom:8px"><div class="row" style="justify-content:space-between;align-items:center;margin-bottom:4px"><small class="muted">Text block ${j + 1}</small><div class="row" style="gap:6px"><button class="btn small" data-mode="${i}:${j}">${modeLabel[bl.mode]}</button>${s.blocks.length > 1 ? `<button class="btn small danger" data-rmblock="${i}:${j}">✕</button>` : ""}</div></div>
          <textarea data-blocktext="${i}:${j}" style="min-height:60px" placeholder="HTML allowed: &lt;b&gt;bold&lt;/b&gt;">${esc(bl.text)}</textarea></div>`).join("")}</div>
        <button class="btn small" data-addtext="${i}">➕ Add Text</button>
        <div data-btns="${i}" style="margin-top:8px">${s.buttons.map((bt, j) => `<div class="grid2"><input type="text" placeholder="Button name" value="${esc(bt.name)}" data-bn="${i}:${j}"><input type="text" placeholder="https://…" value="${esc(bt.url)}" data-bu="${i}:${j}"></div>`).join("")}</div>
        <button class="btn small" data-addb="${i}">➕ Link button</button></div>`).join("");
      $("#items").querySelectorAll("[data-rm]").forEach(x => x.onclick = () => { sel.splice(+x.dataset.rm, 1); draw(); });
      $("#items").querySelectorAll("[data-addb]").forEach(x => x.onclick = () => { sel[+x.dataset.addb].buttons.push({ name: "", url: "" }); draw(); });
      $("#items").querySelectorAll("[data-addtext]").forEach(x => x.onclick = () => { sel[+x.dataset.addtext].blocks.push({ text: "", mode: "plain" }); draw(); });
      $("#items").querySelectorAll("[data-rmblock]").forEach(x => x.onclick = () => { const [i, j] = x.dataset.rmblock.split(":"); sel[i].blocks.splice(j, 1); draw(); });
      $("#items").querySelectorAll("[data-mode]").forEach(x => x.onclick = () => { const [i, j] = x.dataset.mode.split(":"); const bl = sel[i].blocks[j]; bl.mode = modeNext[bl.mode]; draw(); });
      $("#items").querySelectorAll("[data-blocktext]").forEach(x => x.oninput = () => { const [i, j] = x.dataset.blocktext.split(":"); sel[i].blocks[j].text = x.value; });
      $("#items").querySelectorAll("[data-bn]").forEach(x => x.oninput = () => { const [i, j] = x.dataset.bn.split(":"); sel[i].buttons[j].name = x.value; });
      $("#items").querySelectorAll("[data-bu]").forEach(x => x.oninput = () => { const [i, j] = x.dataset.bu.split(":"); sel[i].buttons[j].url = x.value; });
      $("#txtw").style.display = sel.length ? "none" : "";
    };
    const add = fl => { [...fl].forEach(f => sel.push({ file: f, blocks: [{ text: "", mode: "plain" }], buttons: [] })); draw(); };
    const drop = $("#drop"), input = $("#fi");
    drop.onclick = () => input.click();
    drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
    drop.ondragleave = () => drop.classList.remove("over");
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); add(e.dataTransfer.files); };
    input.onchange = () => { add(input.files); input.value = ""; };
    $("#go").onclick = () => {
      const chans = getCh();
      if (!chans.length) return toast("Select a channel", false);
      const fd = new FormData();
      fd.append("meta", JSON.stringify({ channels: chans, when: getT(), quote: false, text: $("#ptxt").value, items: sel.map(s => ({ caption: composeCaption(s.blocks), buttons: s.buttons })) }));
      sel.forEach(s => fd.append("files", s.file));
      const btn = $("#go"); btn.disabled = true;
      $("#prog").innerHTML = `<div class="pbar"><i></i></div><div class="muted st" style="margin-top:6px">0%</div>`;
      const xhr = new XMLHttpRequest();
      xhr.open("POST", "/api/admin/scheduled/post");
      xhr.setRequestHeader("Authorization", "Bearer " + token);
      xhr.upload.onprogress = e => { if (e.lengthComputable) { const p = Math.round(e.loaded / e.total * 100); $("#prog i").style.width = p + "%"; $("#prog .st").textContent = p < 100 ? p + "%" : "uploading to Telegram…"; } };
      xhr.onload = () => {
        btn.disabled = false;
        let d = {}; try { d = JSON.parse(xhr.responseText); } catch {}
        if (xhr.status === 401) return logout(true);
        if (d.ok) { toast("Post scheduled"); go("schedule", "posts"); } else { toast(d.error || "Failed", false); $("#prog").innerHTML = ""; }
      };
      xhr.onerror = () => { btn.disabled = false; toast("Network error", false); };
      xhr.send(fd);
    };
  } else if (sub === "newdel") {
    b.innerHTML = `<div class="panel glass"><h3>Schedule message deletion</h3>
      <label class="f"><span>Message link (open the post → Copy link)</span><input type="text" id="dl" placeholder="https://t.me/c/123456789/42"></label>
      <p class="muted" style="font-size:13px">Or enter a channel and message ID:</p>
      <div id="dch"></div><label class="f"><span>Message ID</span><input type="number" id="dm"></label>
      <div id="dt"></div><button class="btn primary" id="dg">🗑️ Schedule deletion</button>
      <p class="muted" style="font-size:13px">Telegram only lets bots delete messages younger than 48 hours at the time of deletion.</p></div>`;
    const getCh = await channelPicker($("#dch"), false), getT = timePicker($("#dt"));
    $("#dg").onclick = async () => {
      const c = getCh()[0] || {};
      const r = await act(() => api("/scheduled/deletion", { method: "POST", json: { link: $("#dl").value, channel_id: c.id, channel_title: c.title, message_id: $("#dm").value, when: getT() } }), "Deletion scheduled");
      if (r) go("schedule", "dels");
    };
  } else if (sub === "dels") {
    const d = await api("/scheduled");
    b.innerHTML = d.deletions.length ? `<div class="list">${d.deletions.map(x => `<div class="item"><span class="ic">🗑️</span><div class="mid"><b>${esc(x.channel_title || x.channel_id)}</b><small>msg ${esc(x.message_id)} · deletes ${fmtDate(x.when_utc || x.delete_at)}</small></div>
      <div class="acts"><button class="btn small danger" data-del="/scheduled/deletion/${esc(x.id)}" data-name="this scheduled deletion">Cancel</button></div></div>`).join("")}</div>` : `<div class="empty glass panel">No pending deletions.</div>`;
  } else {
    const d = await api("/scheduled");
    b.innerHTML = d.posts.length ? `<div class="list">${d.posts.map(x => `<div class="item"><span class="ic">📤</span><div class="mid"><b>${esc(x.post_type)} · ${(x.files || []).length} item(s)</b><small>${(x.files || []).map(f => esc(f.file_name || f.file_type)).join(", ")}</small><small>${esc(((x.files || [])[0] || {}).caption || "").replace(/&lt;[^&]*?&gt;/g, "").slice(0, 60)}</small><small>📡 ${(x.channel_ids || []).map(c => esc(c.title || c.id)).join(", ")} · ⏰ ${fmtDate(x.when_utc || x.scheduled_time)}</small></div>
      <div class="acts"><button class="btn small danger" data-del="/scheduled/post/${esc(x.id)}" data-name="this scheduled post">Cancel</button></div></div>`).join("")}</div>` : `<div class="empty glass panel">No pending posts.</div>`;
  }
};

    <button class="btn danger" id="cb2">🗑️ Clear everything</button></div>`;
  $("#cb2").onclick = async () => {
    if ($("#cc2").value !== "CLEAR") return toast("Type CLEAR first", false);
    if (await confirmBox("Are you absolutely sure?", "Everything will be erased.", "Yes, clear all") && await act(() => api("/danger/clear", { method: "POST", json: { confirm: "CLEAR" } }), "All data cleared")) go("");
  };
};
VIEWS.logs = async b => {
  const d = await api("/logs");
  b.innerHTML = `<pre class="log" id="lg">${esc(d.lines.join("\n")) || "No logs yet."}</pre>`;
  const lg = $("#lg"); lg.scrollTop = lg.scrollHeight;
};

/* ---------- swipe-to-delete (mobile): swipe a .item left to reveal its existing delete button ---------- */
(function () {
  function wire(item) {
    if (item.dataset.swipeWired || !item.querySelector("[data-del]")) return;
    item.dataset.swipeWired = "1";
    let x0 = null, dx = 0;
    item.style.touchAction = "pan-y";
    item.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; dx = 0; }, { passive: true });
    item.addEventListener("touchmove", e => {
      if (x0 === null) return;
      dx = Math.min(0, e.touches[0].clientX - x0);
      item.style.transform = `translateX(${Math.max(dx, -84)}px)`;
    }, { passive: true });
    item.addEventListener("touchend", () => {
      if (dx < -40) { item.querySelector("[data-del]")?.click(); }
      item.style.transform = ""; x0 = null;
    });
  }
  new MutationObserver(() => $$(".list .item").forEach(wire)).observe($("#app"), { childList: true, subtree: true });
})();

/* ---------- generic delegated actions ---------- */
document.addEventListener("click", async e => {
  const c = e.target.closest("[data-copy]"); if (c) return copy(c.dataset.copy);
  const s = e.target.closest("[data-send]");
  if (s) { s.disabled = true; await act(() => api(s.dataset.send, { method: "POST" }), "Sent to your Telegram"); s.disabled = false; return; }
  const d = e.target.closest("[data-del]");
  if (d) { if (!await confirmBox("Delete?", d.dataset.name || "This item", "Delete")) return; if (await act(() => api(d.dataset.del, { method: "DELETE" }), "Deleted")) reload(); }
});

/* ---------- boot ---------- */
if (token) { api("/ping").then(showApp).catch(() => showLogin()); } else showLogin();
</script>
